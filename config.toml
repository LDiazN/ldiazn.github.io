baseURL = "https://ldiazn.github.io/"
title = "Luis Diaz"
author = "Luis Diaz"
theme = "ldiazn-mono"

# No tag/category list pages
disableKinds = ["taxonomy", "term"]

# Use date from filename (e.g. 2024-02-05-foo.md) when front matter has no date
[frontmatter]
  date = [":filename", ":default"]

[params]
  subtitle = "Software engineer"
  github_url = "https://github.com/ldiazn"
  linkedin_url = "https://www.linkedin.com/in/ldiazn-cs"
  twitter_url = "https://twitter.com/Luduz98"
  description = """
  I'm a computer engineer currently working as an Open Source developer at
  <a href="https://ooni.org/">OONI</a>, where I mostly do backend work. I have a
  <strong>B.S. in Computer Science</strong> from Universidad Simón Bolívar in
  Venezuela. I'm passionate about software engineering, computer graphics, and
  game development. On this blog, you'll find the projects I work on and things
  I find interesting!
  """
  show_navbar = true
  show_footer = true
  show_projects = true
  show_blog = true
  show_old_projects = false
  show_misc_list = false
  show_reading_time = true
  show_tags = true
  show_description = true
  show_copyright = false
  date_format = "2006-01-02"
  back_home_text = "home.."

  [params.home]
    title_projects = "Projects"
    title_misc_list = "Details"
    title_blog = "Blog"
    title_old_projects = "Old Projects"
    n_projects = 3
    n_blogs = 3

[permalinks]
  blog = "/:slug/"

[outputs]
  home = ["HTML", "RSS"]

# Allow raw HTML in markdown (e.g. divs, inline styles in content)
[markup]
  [markup.goldmark.renderer]
    unsafe = true
